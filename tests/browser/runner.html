<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinPoint — In-Browser Test Suite & Verification</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --card: #0f172a;
      --card-inner: #162032;
      --border: #243247;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0ea5e9;
      --pass: #10b981;
      --fail: #ef4444;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .stats-bar {
      display: flex;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1.5rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: 800;
    }
    .stat-val.pass { color: var(--pass); }
    .stat-val.fail { color: var(--fail); }
    .stat-lbl {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .suite-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .suite-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .test-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-inner);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }
    .test-name {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge.pass { background: rgba(16, 185, 129, 0.2); color: var(--pass); }
    .badge.fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); }
    .run-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .run-btn:hover {
      filter: brightness(1.1);
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">PinPoint Test Runner</div>
      <div class="subtitle">Real-Browser In-Situ Unit & UI Verification</div>
    </div>
    <button type="button" class="run-btn" id="runTestsBtn">▶ Run All Tests</button>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-val" id="totalCount">0</span>
      <span class="stat-lbl">Total Tests</span>
    </div>
    <div class="stat-item">
      <span class="stat-val pass" id="passCount">0</span>
      <span class="stat-lbl">Passed</span>
    </div>
    <div class="stat-item">
      <span class="stat-val fail" id="failCount">0</span>
      <span class="stat-lbl">Failed</span>
    </div>
  </div>

  <div id="resultsContainer"></div>

  <!-- Hidden iframe loading the live index.html -->
  <iframe id="testIframe" src="../../index.html"></iframe>

  <script>
    const iframe = document.getElementById('testIframe');
    const runBtn = document.getElementById('runTestsBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const totalCountEl = document.getElementById('totalCount');
    const passCountEl = document.getElementById('passCount');
    const failCountEl = document.getElementById('failCount');

    let totalTests = 0;
    let passedTests = 0;
    let failedTests = 0;

    function assert(condition, message) {
      if (!condition) throw new Error(message || 'Assertion failed');
    }
    assert.strictEqual = (actual, expected, msg) => {
      if (actual !== expected) throw new Error(msg || `Expected ${expected}, but got ${actual}`);
    };
    assert.deepStrictEqual = (actual, expected, msg) => {
      const a = JSON.stringify(actual);
      const b = JSON.stringify(expected);
      if (a !== b) throw new Error(msg || `Expected ${b}, but got ${a}`);
    };
    assert.ok = (condition, msg) => {
      if (!condition) throw new Error(msg || 'Value was not truthy');
    };

    const suites = [
      {
        name: 'Unit: Badge Presets & Sizing',
        tests: [
          {
            name: 'Contains standard VEVOR presets (58, 44, 32, 25, 75, custom)',
            fn: (win) => {
              assert.deepStrictEqual(win.BADGE_PRESETS['58'], { visible: 58, cut: 70 });
              assert.deepStrictEqual(win.BADGE_PRESETS['44'], { visible: 44, cut: 54 });
              assert.deepStrictEqual(win.BADGE_PRESETS['32'], { visible: 32, cut: 44 });
              assert.deepStrictEqual(win.BADGE_PRESETS['25'], { visible: 25, cut: 35 });
              assert.deepStrictEqual(win.BADGE_PRESETS['75'], { visible: 75, cut: 86 });
            }
          },
          {
            name: 'Calculates bleed/wrap accurately ((cut - visible) / 2)',
            fn: (win) => {
              const calc = (v, c) => (c - v) / 2;
              assert.strictEqual(calc(58, 70), 6);
              assert.strictEqual(calc(44, 54), 5);
              assert.strictEqual(calc(75, 86), 5.5);
            }
          },
          {
            name: 'Calculates Fit Face zoom scale accurately (visible / cut)',
            fn: (win) => {
              assert.strictEqual(parseFloat((58 / 70).toFixed(2)), 0.83);
              assert.strictEqual(parseFloat((44 / 54).toFixed(2)), 0.81);
            }
          }
        ]
      },
      {
        name: 'Unit: Circle Packing & Placement',
        tests: [
          {
            name: 'packCircles returns empty array for empty items',
            fn: (win) => {
              const res = win.packCircles([], 210, 297, 5, 2.5);
              assert.deepStrictEqual(res, []);
            }
          },
          {
            name: 'packCircles respects sheet margins and minimum gap',
            fn: (win) => {
              const items = [
                { id: '1', radius: 35, cutMm: 70 },
                { id: '2', radius: 35, cutMm: 70 }
              ];
              const pages = win.packCircles(items, 210, 297, 5, 2.5);
              assert.strictEqual(pages.length, 1);
              const p = pages[0];
              assert.ok(p[0].x - 35 >= 4.99);
              assert.ok(p[0].y - 35 >= 4.99);
              const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
              assert.ok(dist >= 35 + 35 + 2.5 - 0.05);
            }
          }
        ]
      },
      {
        name: 'Unit: I18N Localization',
        tests: [
          {
            name: 'Ukrainian (uk) and English (en) dictionaries have 100% key parity',
            fn: (win) => {
              const ukKeys = Object.keys(win.I18N.uk).sort();
              const enKeys = Object.keys(win.I18N.en).sort();
              assert.strictEqual(ukKeys.length, enKeys.length);
              assert.deepStrictEqual(ukKeys, enKeys);
            }
          },
          {
            name: 'All data-i18n attributes in DOM exist in dictionary',
            fn: (win) => {
              const tags = [...win.document.querySelectorAll('[data-i18n]')].map(el => el.getAttribute('data-i18n'));
              for (const tag of tags) {
                assert.ok(win.I18N.uk[tag], `Missing tag in UK: ${tag}`);
                assert.ok(win.I18N.en[tag], `Missing tag in EN: ${tag}`);
              }
            }
          }
        ]
      },
      {
        name: 'UI: Editor Buttons & Steppers',
        tests: [
          {
            name: 'Center button centers image coordinates (0, 0)',
            fn: (win) => {
              win.state.imgX = 25;
              win.state.imgY = -15;
              win.document.getElementById('centerImgBtn').click();
              assert.strictEqual(win.state.imgX, 0);
              assert.strictEqual(win.state.imgY, 0);
            }
          },
          {
            name: '0° button resets rotation to 0',
            fn: (win) => {
              win.state.rotation = 90;
              win.document.getElementById('resetRotBtn').click();
              assert.strictEqual(win.state.rotation, 0);
            }
          },
          {
            name: 'Copies stepper increments and decrements quantity',
            fn: (win) => {
              win.state.copies = 1;
              win.document.getElementById('copyIncBtn').click();
              assert.strictEqual(win.state.copies, 2);
              win.document.getElementById('copyDecBtn').click();
              assert.strictEqual(win.state.copies, 1);
            }
          }
        ]
      },
      {
        name: 'UI: Document Management & Navigation',
        tests: [
          {
            name: 'Mobile tab navigation switches active classes correctly',
            fn: (win) => {
              win.switchMobileTab('sheet', false);
              assert.ok(win.document.getElementById('sheetPanel').classList.contains('mobile-active'));
              win.switchMobileTab('editor', false);
              assert.ok(win.document.getElementById('editorPanel').classList.contains('mobile-active'));
            }
          },
          {
            name: 'Clicking bottom nav tab button triggers tab switch',
            fn: (win) => {
              const tabSheet = win.document.querySelector('.mobile-nav-tab[data-tab="sheet"]');
              const tabEditor = win.document.querySelector('.mobile-nav-tab[data-tab="editor"]');
              assert.ok(tabSheet, 'Sheet tab must exist');
              assert.ok(tabEditor, 'Editor tab must exist');
              tabSheet.click();
              assert.ok(win.document.getElementById('sheetPanel').classList.contains('mobile-active'));
              tabEditor.click();
              assert.ok(win.document.getElementById('editorPanel').classList.contains('mobile-active'));
            }
          },
          {
            name: 'Fast print button exists and checks for empty document',
            fn: (win) => {
              const printBtn = win.document.getElementById('printSheetBtn');
              assert.ok(printBtn, 'Print button must exist');
              win.state.queue = [];
              win.state.packedPages = [];
              let printed = false;
              const origPrint = win.print;
              win.print = () => { printed = true; };
              try {
                printBtn.click();
                assert.strictEqual(printed, false, 'Print dialog must not open on empty document');
              } finally {
                win.print = origPrint;
              }
            }
          },
          {
            name: 'Loading badge into editor restores preset and copies',
            fn: (win) => {
              const mock = {
                id: 'm1',
                name: 'Test',
                visibleMm: 44,
                cutMm: 54,
                count: 4,
                thumbUrl: 'data:image/png;base64,abc'
              };
              win.loadBadgeIntoEditor(mock);
              assert.strictEqual(win.state.visibleMm, 44);
              assert.strictEqual(win.state.cutMm, 54);
              assert.strictEqual(win.state.copies, 4);
            }
          }
        ]
      }
    ];

    async function runAll() {
      totalTests = 0;
      passedTests = 0;
      failedTests = 0;
      resultsContainer.innerHTML = '';

      const win = iframe.contentWindow;
      if (!win || !win.state) {
        alert('Iframe application is still loading. Please retry in a moment.');
        return;
      }

      for (const suite of suites) {
        const card = document.createElement('div');
        card.className = 'suite-card';
        card.innerHTML = `<div class="suite-title"><span>${suite.name}</span></div>`;

        for (const test of suite.tests) {
          totalTests++;
          const row = document.createElement('div');
          row.className = 'test-row';

          try {
            await test.fn(win);
            passedTests++;
            row.innerHTML = `
              <div class="test-name"><span>✔</span> <span>${test.name}</span></div>
              <span class="badge pass">PASS</span>
            `;
          } catch (err) {
            failedTests++;
            row.innerHTML = `
              <div class="test-name"><span>✖</span> <span>${test.name} (${err.message})</span></div>
              <span class="badge fail">FAIL</span>
            `;
          }
          card.appendChild(row);
        }
        resultsContainer.appendChild(card);
      }

      totalCountEl.textContent = totalTests;
      passCountEl.textContent = passedTests;
      failCountEl.textContent = failedTests;
    }

    runBtn.addEventListener('click', runAll);
    iframe.addEventListener('load', () => {
      runAll();
    });
  </script>
</body>
</html>
